services:
  auth:
    image: ${REVIEWER_IMAGE:-johnndelembi/pr-reviewer-local:0.2.0}
    profiles: [auth]
    command: [login]
    read_only: true
    user: ${REVIEWER_UID:-1000}:${REVIEWER_GID:-1000}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      CODEX_HOME: /codex/${REVIEWER_UID:-1000}
    volumes:
      - codex-login:/codex
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m,mode=1777
  setup:
    image: ${REVIEWER_IMAGE:-johnndelembi/pr-reviewer-local:0.2.0}
    profiles: [setup]
    command: [init]
    network_mode: none
    read_only: true
    user: ${REVIEWER_UID:-1000}:${REVIEWER_GID:-1000}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./config:/config
  reviewer:
    image: ${REVIEWER_IMAGE:-johnndelembi/pr-reviewer-local:0.2.0}
    build: .
    init: true
    restart: unless-stopped
    read_only: true
    user: ${REVIEWER_UID:-1000}:${REVIEWER_GID:-1000}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    cpus: 2
    environment:
      GH_TOKEN: ${GH_TOKEN:-}
      AI_API_KEY: ${AI_API_KEY:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/data/google-application-default-credentials.json}
      CODEX_HOME: /codex/${REVIEWER_UID:-1000}
    volumes:
      - ./config:/config:ro
      - ./data:/data
      - codex-login:/codex
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    extra_hosts:
      - host.docker.internal:host-gateway
    logging:
      driver: json-file
      options: {max-size: 2m, max-file: "3"}

volumes:
  codex-login:

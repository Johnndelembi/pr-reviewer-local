services:
  setup:
    image: ${REVIEWER_IMAGE:-johnndelembi/pr-reviewer-local:0.1.2}
    profiles: [setup]
    command: [init]
    network_mode: none
    read_only: true
    user: ${REVIEWER_UID:-1000}:${REVIEWER_GID:-1000}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./config:/config
  reviewer:
    image: ${REVIEWER_IMAGE:-johnndelembi/pr-reviewer-local:0.1.2}
    build: .
    init: true
    restart: unless-stopped
    read_only: true
    user: ${REVIEWER_UID:-1000}:${REVIEWER_GID:-1000}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    cpus: 2
    environment:
      GH_TOKEN: ${GH_TOKEN:-}
      AI_API_KEY: ${AI_API_KEY:-}
    volumes:
      - ./config:/config:ro
      - ./data:/data
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    extra_hosts:
      - host.docker.internal:host-gateway
    logging:
      driver: json-file
      options: {max-size: 2m, max-file: "3"}
